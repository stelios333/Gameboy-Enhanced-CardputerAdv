[platformio]
src_dir = src
include_dir = include
lib_dir = lib

[env:m5stack-cardputer]
platform = espressif32
; Cardputer ADV is ESP32-S3 (8MB, no PSRAM)
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
lib_deps = m5stack/M5Cardputer
build_flags =
    -Ilib/Walnut-CGB
    -Ilib/minigb_apu_cardputer
    -DENABLE_SOUND=1
    -DENABLE_LCD=1
    -DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
    -O2
    
build_unflags = -std=gnu++11
build_src_flags = -std=gnu++20

; lib/minigb_apu_cardputer/minigb_apu.c includes "../glue.h", which resolves to
; lib/glue.h.  The upstream glue.h predates the ESP32-S3 toolchain (it typedefs
; int32_t/uint32_t/bool over the system headers), so lib/glue.h is a small
; toolchain-compatible replacement.
